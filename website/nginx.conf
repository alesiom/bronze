server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SEO files - serve directly with correct content types
    location = /robots.txt {
        add_header Content-Type text/plain;
    }
    location = /sitemap.xml {
        add_header Content-Type application/xml;
    }
    location ~* ^/sitemap.*\.xml$ {
        add_header Content-Type application/xml;
    }

    # Cache static assets
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Static assets (CSS, JS) - ^~ prevents regex matching
    location ^~ /static/ {
        alias /usr/share/nginx/html/articles/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Generated images (articles, social media)
    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # App landing page
    location = /app {
        try_files /app.html =404;
    }
    location = /app/ {
        try_files /app.html =404;
    }

    # Privacy and support pages
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /privacy/ {
        try_files /privacy.html =404;
    }
    location = /support {
        try_files /support.html =404;
    }
    location = /support/ {
        try_files /support.html =404;
    }

    # ===========================================
    # Category index pages (English) - served from _pages
    # ===========================================

    # Athletes index
    location = /athletes/ {
        alias /usr/share/nginx/html/articles/_pages/athletes/;
        try_files index.html =404;
    }
    location = /athletes {
        return 301 /athletes/;
    }

    # Venues index
    location = /venues/ {
        alias /usr/share/nginx/html/articles/_pages/venues/;
        try_files index.html =404;
    }
    location = /venues {
        return 301 /venues/;
    }

    # History index
    location = /history/ {
        alias /usr/share/nginx/html/articles/_pages/history/;
        try_files index.html =404;
    }
    location = /history {
        return 301 /history/;
    }

    # Guides index
    location = /guides/ {
        alias /usr/share/nginx/html/articles/_pages/guides/;
        try_files index.html =404;
    }
    location = /guides {
        return 301 /guides/;
    }

    # Sport category indexes
    location = /alpine-skiing/ {
        alias /usr/share/nginx/html/articles/_pages/alpine-skiing/;
        try_files index.html =404;
    }
    location = /alpine-skiing {
        return 301 /alpine-skiing/;
    }

    location = /biathlon/ {
        alias /usr/share/nginx/html/articles/_pages/biathlon/;
        try_files index.html =404;
    }
    location = /biathlon {
        return 301 /biathlon/;
    }

    location = /cross-country/ {
        alias /usr/share/nginx/html/articles/_pages/cross-country/;
        try_files index.html =404;
    }
    location = /cross-country {
        return 301 /cross-country/;
    }

    location = /ski-jumping/ {
        alias /usr/share/nginx/html/articles/_pages/ski-jumping/;
        try_files index.html =404;
    }
    location = /ski-jumping {
        return 301 /ski-jumping/;
    }

    location = /news/ {
        alias /usr/share/nginx/html/articles/_pages/news/;
        try_files index.html =404;
    }
    location = /news {
        return 301 /news/;
    }

    location = /nordic-combined/ {
        alias /usr/share/nginx/html/articles/_pages/nordic-combined/;
        try_files index.html =404;
    }
    location = /nordic-combined {
        return 301 /nordic-combined/;
    }

    location = /freestyle/ {
        alias /usr/share/nginx/html/articles/_pages/freestyle/;
        try_files index.html =404;
    }
    location = /freestyle {
        return 301 /freestyle/;
    }

    location = /snowboard/ {
        alias /usr/share/nginx/html/articles/_pages/snowboard/;
        try_files index.html =404;
    }
    location = /snowboard {
        return 301 /snowboard/;
    }

    # ===========================================
    # Hierarchical article URLs (English): /{category}/{slug}/
    # ===========================================

    location ~ ^/(athletes|venues|history|guides|alpine-skiing|biathlon|cross-country|ski-jumping|nordic-combined|freestyle|snowboard|news)/([a-z0-9][a-z0-9-]+[a-z0-9])/?$ {
        alias /usr/share/nginx/html/articles/$1/$2/;
        try_files index.html =404;
    }

    # ===========================================
    # Language-specific routes
    # ===========================================

    # Language-specific homepages: /{lang}/
    location ~ ^/(de|fr|it|es|pt|nl|ar|ja|zh|ko)/?$ {
        alias /usr/share/nginx/html/articles/_pages/$1/;
        try_files index.html /index.html =404;
    }

    # Language-specific category indexes: /{lang}/{category}/
    location ~ ^/(de|fr|it|es|pt|nl|ar|ja|zh|ko)/(athletes|venues|history|guides|alpine-skiing|biathlon|cross-country|ski-jumping|nordic-combined|freestyle|snowboard|news)/?$ {
        alias /usr/share/nginx/html/articles/_pages/$1/$2/;
        try_files index.html =404;
    }

    # Language-specific articles: /{lang}/{category}/{slug}/
    location ~ ^/(de|fr|it|es|pt|nl|ar|ja|zh|ko)/(athletes|venues|history|guides|alpine-skiing|biathlon|cross-country|ski-jumping|nordic-combined|freestyle|snowboard|news)/([a-z0-9][a-z0-9-]+[a-z0-9])/?$ {
        alias /usr/share/nginx/html/articles/$1/$2/$3/;
        try_files index.html =404;
    }

    # ===========================================
    # Legacy flat URLs - redirect to hierarchical
    # ===========================================

    # Old flat article URLs redirect to new hierarchical structure
    # This will be handled by a rewrite map or 404 with redirect suggestion

    # Homepage - serve generated news page from articles volume
    location = / {
        alias /usr/share/nginx/html/articles/_pages/;
        try_files index.html /index.html;
    }

    # Main location (catch-all)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
