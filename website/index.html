<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neve26 - Winter Games Italy Schedule Tracker</title>
  <meta name="description" content="Track every event at the Winter Games Italy 2026. Real-time schedule updates, favorites, and notifications.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a5f 0%, #0f1f33 100%);
      color: white;
      text-align: center;
      padding: 2rem;
    }
    html[dir="rtl"] body { direction: rtl; }
    .container { max-width: 480px; width: 100%; }
    .lang-selector {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    html[dir="rtl"] .lang-selector { right: auto; left: 1rem; }
    .lang-selector:focus { outline: 2px solid white; }
    .logo { font-size: 4rem; margin-bottom: 0.5rem; }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .tagline { font-size: 1.1rem; opacity: 0.85; margin-bottom: 2rem; }

    .signup-form {
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .signup-title { font-size: 1rem; margin-bottom: 1rem; opacity: 0.9; }
    .input-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .signup-form input[type="email"] {
      flex: 1;
      min-width: 200px;
      padding: 0.875rem 1rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      background: white;
      color: #1e3a5f;
    }
    .signup-form input[type="email"]::placeholder { color: #666; }
    .signup-form button {
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      background: #4a90d9;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    .signup-form button:hover { background: #3a7bc8; }
    .signup-form button:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-message {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      min-height: 1.4em;
    }
    .form-message.success { color: #4ade80; }
    .form-message.error { color: #f87171; }

    .store-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: white;
      color: #1e3a5f;
      text-decoration: none;
      padding: 0.875rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      width: 220px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .store-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .store-btn svg { width: 28px; height: 28px; }
    .coming-soon {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <select class="lang-selector" id="langSelect" aria-label="Select language">
    <option value="en">English</option>
    <option value="de">Deutsch</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
    <option value="es">Español</option>
    <option value="pt">Português</option>
    <option value="nl">Nederlands</option>
    <option value="ar">العربية</option>
    <option value="ja">日本語</option>
    <option value="zh">中文</option>
    <option value="ko">한국어</option>
  </select>

  <div class="container">
    <div class="logo">❄️</div>
    <h1>Neve26</h1>
    <p class="tagline" data-i18n="tagline">Track every event. Every update.</p>

    <form class="signup-form" id="signupForm">
      <p class="signup-title" data-i18n="notifyMe">Get notified when the app launches</p>
      <div class="input-group">
        <input type="email" id="email" required placeholder="email@example.com" data-i18n-placeholder="emailPlaceholder">
        <button type="submit" data-i18n="subscribe">Notify me</button>
      </div>
      <p class="form-message" id="formMessage"></p>
    </form>

    <div class="store-buttons">
      <a href="#" class="store-btn" aria-label="Download on the App Store">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        App Store
      </a>
      <a href="#" class="store-btn" aria-label="Get it on Google Play">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
        </svg>
        Google Play
      </a>
    </div>

    <p class="coming-soon" data-i18n="comingSoon">Coming February 2026</p>
  </div>

  <script>
    const translations = {
      en: {
        tagline: "Track every event. Every update.",
        notifyMe: "Get notified when the app launches",
        emailPlaceholder: "email@example.com",
        subscribe: "Notify me",
        comingSoon: "Coming February 2026",
        success: "You're on the list!",
        error: "Something went wrong. Please try again.",
        invalid: "Please enter a valid email"
      },
      de: {
        tagline: "Jedes Event. Jedes Update.",
        notifyMe: "Benachrichtigt werden, wenn die App startet",
        emailPlaceholder: "email@beispiel.de",
        subscribe: "Benachrichtigen",
        comingSoon: "Kommt Februar 2026",
        success: "Du bist auf der Liste!",
        error: "Etwas ist schiefgelaufen. Bitte versuche es erneut.",
        invalid: "Bitte gib eine gültige E-Mail ein"
      },
      fr: {
        tagline: "Chaque événement. Chaque mise à jour.",
        notifyMe: "Soyez notifié au lancement de l'app",
        emailPlaceholder: "email@exemple.fr",
        subscribe: "Me notifier",
        comingSoon: "Disponible en février 2026",
        success: "Vous êtes inscrit !",
        error: "Une erreur s'est produite. Veuillez réessayer.",
        invalid: "Veuillez entrer un email valide"
      },
      it: {
        tagline: "Ogni evento. Ogni aggiornamento.",
        notifyMe: "Ricevi una notifica al lancio dell'app",
        emailPlaceholder: "email@esempio.it",
        subscribe: "Avvisami",
        comingSoon: "In arrivo a febbraio 2026",
        success: "Sei nella lista!",
        error: "Qualcosa è andato storto. Riprova.",
        invalid: "Inserisci un'email valida"
      },
      es: {
        tagline: "Cada evento. Cada actualización.",
        notifyMe: "Recibe una notificación cuando lance la app",
        emailPlaceholder: "email@ejemplo.es",
        subscribe: "Notificarme",
        comingSoon: "Disponible en febrero 2026",
        success: "¡Estás en la lista!",
        error: "Algo salió mal. Por favor, inténtalo de nuevo.",
        invalid: "Por favor, introduce un email válido"
      },
      pt: {
        tagline: "Cada evento. Cada atualização.",
        notifyMe: "Seja notificado quando o app for lançado",
        emailPlaceholder: "email@exemplo.pt",
        subscribe: "Notificar-me",
        comingSoon: "Disponível em fevereiro de 2026",
        success: "Você está na lista!",
        error: "Algo deu errado. Por favor, tente novamente.",
        invalid: "Por favor, insira um email válido"
      },
      nl: {
        tagline: "Elk evenement. Elke update.",
        notifyMe: "Ontvang een melding wanneer de app live gaat",
        emailPlaceholder: "email@voorbeeld.nl",
        subscribe: "Meld mij aan",
        comingSoon: "Beschikbaar februari 2026",
        success: "Je staat op de lijst!",
        error: "Er is iets misgegaan. Probeer het opnieuw.",
        invalid: "Voer een geldig e-mailadres in"
      },
      ar: {
        tagline: "كل حدث. كل تحديث.",
        notifyMe: "احصل على إشعار عند إطلاق التطبيق",
        emailPlaceholder: "email@example.com",
        subscribe: "أبلغني",
        comingSoon: "قريباً في فبراير 2026",
        success: "أنت في القائمة!",
        error: "حدث خطأ. يرجى المحاولة مرة أخرى.",
        invalid: "يرجى إدخال بريد إلكتروني صالح"
      },
      ja: {
        tagline: "すべてのイベント。すべての更新。",
        notifyMe: "アプリのリリース時に通知を受け取る",
        emailPlaceholder: "email@example.com",
        subscribe: "通知する",
        comingSoon: "2026年2月公開予定",
        success: "リストに登録されました！",
        error: "エラーが発生しました。もう一度お試しください。",
        invalid: "有効なメールアドレスを入力してください"
      },
      zh: {
        tagline: "追踪每个赛事。每次更新。",
        notifyMe: "应用上线时通知我",
        emailPlaceholder: "email@example.com",
        subscribe: "通知我",
        comingSoon: "2026年2月上线",
        success: "您已加入名单！",
        error: "出错了，请重试。",
        invalid: "请输入有效的电子邮件"
      },
      ko: {
        tagline: "모든 이벤트. 모든 업데이트.",
        notifyMe: "앱 출시 알림 받기",
        emailPlaceholder: "email@example.com",
        subscribe: "알림 받기",
        comingSoon: "2026년 2월 출시 예정",
        success: "등록되었습니다!",
        error: "문제가 발생했습니다. 다시 시도해 주세요.",
        invalid: "유효한 이메일을 입력해 주세요"
      }
    };

    const rtlLangs = ['ar'];
    let currentLang = 'en';

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang] || translations.en;

      document.documentElement.lang = lang;
      document.documentElement.dir = rtlLangs.includes(lang) ? 'rtl' : 'ltr';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key]) el.placeholder = t[key];
      });

      localStorage.setItem('neve26_lang', lang);
    }

    // Detect language
    const savedLang = localStorage.getItem('neve26_lang');
    const browserLang = navigator.language.split('-')[0];
    const detectedLang = savedLang || (translations[browserLang] ? browserLang : 'en');

    document.getElementById('langSelect').value = detectedLang;
    setLanguage(detectedLang);

    document.getElementById('langSelect').addEventListener('change', (e) => {
      setLanguage(e.target.value);
    });

    // Form submission
    const N8N_WEBHOOK_URL = '__N8N_WEBHOOK_URL__'; // Replace with actual n8n webhook URL

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const message = document.getElementById('formMessage');
      const button = e.target.querySelector('button');
      const t = translations[currentLang];

      if (!email || !email.includes('@')) {
        message.textContent = t.invalid;
        message.className = 'form-message error';
        return;
      }

      button.disabled = true;
      message.textContent = '';

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            language: currentLang,
            source: 'landing_page',
            timestamp: new Date().toISOString()
          })
        });

        if (response.ok) {
          message.textContent = t.success;
          message.className = 'form-message success';
          document.getElementById('email').value = '';
        } else {
          throw new Error('Failed');
        }
      } catch (err) {
        message.textContent = t.error;
        message.className = 'form-message error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
