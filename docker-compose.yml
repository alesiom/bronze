version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: bronze-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neve26
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching and queues (optional)
  redis:
    image: redis:7-alpine
    container_name: bronze-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bronze-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/neve26
      - ENV=development
      - DEBUG=true
      - HTML_OUTPUT_PATH=/var/www/bronze.news
      # Jinja2 template configuration (Phase 2 architecture refactor)
      - USE_JINJA_TEMPLATES=true
      - TEMPLATES_PATH=/app/website/templates
      - I18N_PATH=/app/website/i18n
      # Alert webhook for monitoring (Phase 6)
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-http://n8n:5678/webhook/bronze-alerts}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - html_content:/var/www/bronze.news
      - html_content_images:/var/www/bronze.news/images
      # Mount templates and i18n for Jinja2
      - ./website/templates:/app/website/templates:ro
      - ./website/i18n:/app/website/i18n:ro
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Scraper service
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bronze-scraper
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/neve26
      - ENV=development
      - SCRAPE_ENABLED=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    command: python -m src.scraper.main
    profiles:
      - scraper  # Only start with: docker-compose --profile scraper up

  # Landing page / Website
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: bronze-website
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./website/static:/usr/share/nginx/html/static:ro
      - html_content:/usr/share/nginx/html/articles:ro
      - html_content_images:/usr/share/nginx/html/images:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # n8n workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: bronze-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=Europe/Rome
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  # Matomo analytics
  matomo:
    image: matomo:latest
    container_name: bronze-matomo
    ports:
      - "8080:80"
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_ADAPTER=mysql
      - MATOMO_DATABASE_TABLES_PREFIX=matomo_
      - MATOMO_DATABASE_USERNAME=matomo
      - MATOMO_DATABASE_PASSWORD=${MATOMO_DB_PASSWORD:-matomo_secure_password}
      - MATOMO_DATABASE_DBNAME=matomo
    volumes:
      - matomo_data:/var/www/html
    depends_on:
      - matomo-db
    restart: unless-stopped

  matomo-db:
    image: mariadb:10.11
    container_name: bronze-matomo-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MATOMO_DB_ROOT_PASSWORD:-root_secure_password}
      - MYSQL_DATABASE=matomo
      - MYSQL_USER=matomo
      - MYSQL_PASSWORD=${MATOMO_DB_PASSWORD:-matomo_secure_password}
    volumes:
      - matomo_db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  matomo_data:
  matomo_db_data:
  html_content:        # Shared volume for generated HTML articles
  html_content_images: # Shared volume for generated images (articles, social)
