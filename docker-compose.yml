version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: neve26-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neve26
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching and queues (optional)
  redis:
    image: redis:7-alpine
    container_name: neve26-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neve26-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/neve26
      - ENV=development
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Scraper service
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neve26-scraper
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/neve26
      - ENV=development
      - SCRAPE_ENABLED=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    command: python -m src.scraper.main
    profiles:
      - scraper  # Only start with: docker-compose --profile scraper up

volumes:
  postgres_data:
  redis_data:
